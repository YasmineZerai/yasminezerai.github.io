      color: "lilac"
      kicker: "Open source · on PyPI"
      title: "loopview"
      logo: "loopview/logo.svg"
      visual: { kind: "image", src: "loopview/card-graph-light.png", alt: "loopview's graph view: a coordinator agent hands work to two researcher agents running in parallel, each looping between its model and its tools, then a writer agent finishes." }
      summary: "I built a local debugger that draws any AI agent's run as a live graph, from standard OpenTelemetry traces."
      badges: ["On PyPI", "53 design decisions", "Live demo"]
      proof:
        - "**One view** for LangGraph, Pydantic AI, CrewAI, the OpenAI Agents SDK and hand-written loops"
        - "Try it: `uvx loopview demo`"
      stack: ["Python", "FastAPI", "OpenTelemetry", "React 19", "TypeScript", "React Flow"]
      cta: "Read the case study"
      links:
        - { label: "Live demo", href: "https://yasminezerai.github.io/loopview/" }
        - { label: "GitHub README", href: "https://github.com/YasmineZerai/loopview#readme" }

    - slug: "multi-agent-support"
      color: "mint"
      kicker: "Academic · team of 4"
      title: "Multi-agent customer support"
      visual: { kind: "image", src: "pfa/dashboard-overview.png", alt: "Admin dashboard of the support system: open tickets, active sessions, average resolution time and escalation rate, ticket volume by type over 7 days, and how requests were routed across the five agents." }
