beekeeper-contributions:
  title: "Brood Presence Confidence, built from the fleet's data"
  caption: "An illustration of the method, not real values: what was compared, not how it is computed."
  alt: "Pipeline diagram. Step 1, data: historical recordings from the whole fleet go through exploratory analysis (many hives scoring near zero without being sick), correlation analysis between brood, hive and outside temperatures, and a gradient-boosted regression of hive readings on outside weather. Step 2, features: three brood behaviours, a narrow temperature band, being warmer than the hive, and being shielded from outside swings. Step 3: they combine into a confidence c between 0 and 1; when c drops, brood penalties drop, giving uncertainty instead of a false alarm. Step 4: checked against the fleet, where a decline on many devices at once from mid-October matched the end of the brood season, not sensor faults."
  labels:
    h1: "1 · Data"
    h2: "2 · Features"
    h3: "3 · Confidence"
    d1: "Historical fleet recordings"
    d1_note: "whole fleet · sensor time series"
    d2: "EDA"
    d2_note: "many hives near 0, not actually sick"
    d3: "Correlation analysis (Pearson, Spearman)"
    d4: "Gradient-boosted regression"
    b1: "Narrow temperature band"
    b2: "Warmer than the hive"
    b3: "Shielded from outside swings"
    result: "uncertainty, no false alarm"
    check: "Checked against the fleet"
    check_note: ["A decline on many devices at once from mid-October:", "the end of the brood season, not sensor faults."]
